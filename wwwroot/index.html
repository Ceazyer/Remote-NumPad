<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f7">
  <title>Remote NumPad · 录入面板</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="dpad-raised" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
        <feDropShadow dx="-6" dy="-6" stdDeviation="6" class="dpad-highlight" />
        <feDropShadow dx="6" dy="6" stdDeviation="6" class="dpad-shadow" />
      </filter>
      <filter id="dpad-inset" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
        <feOffset in="blur" dx="3" dy="3" result="offset-dark" />
        <feComposite in="SourceAlpha" in2="offset-dark" operator="out" result="edge-dark" />
        <feFlood class="dpad-shadow" result="dark-color" />
        <feComposite in="dark-color" in2="edge-dark" operator="in" result="dark" />
        <feOffset in="blur" dx="-3" dy="-3" result="offset-light" />
        <feComposite in="SourceAlpha" in2="offset-light" operator="out" result="edge-light" />
        <feFlood class="dpad-highlight" result="light-color" />
        <feComposite in="light-color" in2="edge-light" operator="in" result="light" />
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge>
      </filter>
      <symbol id="icon-undo" viewBox="0 0 24 24"><path d="m9 5-5 5 5 5M4 10h10a6 6 0 0 1 0 12"/></symbol>
      <symbol id="icon-prev" viewBox="0 0 24 24"><path d="M5 5v14m13-12-5 5 5 5m-5-5H8"/></symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm9-9 4 4M3 21h18"/></symbol>
      <symbol id="icon-delete" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m9 9 6 6m0-6-6 6"/></symbol>
      <symbol id="icon-backspace" viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7 6-7Zm3 4 6 6m0-6-6 6"/></symbol>
      <symbol id="icon-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="icon-next" viewBox="0 0 24 24"><path d="M19 5v14M6 7l5 5-5 5m5-5h5"/></symbol>
      <symbol id="icon-enter" viewBox="0 0 24 24"><path d="M20 5v8H4m5-5-5 5 5 5"/></symbol>
      <symbol id="icon-left" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
      <symbol id="icon-up" viewBox="0 0 24 24"><path d="M12 20V4M6 10l6-6 6 6"/></symbol>
      <symbol id="icon-down" viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6"/></symbol>
      <symbol id="icon-right" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 4H5a2 2 0 0 0-2 2v10"/></symbol>
      <symbol id="icon-paste" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="5" rx="2"/><path d="M8 5H5v16h14V5h-3M8 12h8m-8 4h8"/></symbol>
      <symbol id="icon-save" viewBox="0 0 24 24"><path d="M4 3h13l4 4v14H3V3h1Zm3 0v6h9V3M7 21v-8h10v8"/></symbol>
      <symbol id="icon-save-as" viewBox="0 0 24 24"><path d="M11 21H3V3h13l5 5v3M7 3v6h9V3m-9 18v-8h5m2 4 5-5 3 3-5 5-4 1 1-4Zm3-3 3 3"/></symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5Z"/></symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m9 3-.8 3-2 .9-2.7-.8L2 9l2.2 2.2v1.6L2 15l1.5 2.9 2.7-.8 2 .9L9 21h6l.8-3 2-.9 2.7.8L22 15l-2.2-2.2v-1.6L22 9l-1.5-2.9-2.7.8-2-.9L15 3Z"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
    </defs>
  </svg>
  <main class="panel" aria-label="Excel 录入面板">
    <header class="panel-header">
      <div class="identity"><h1>Remote NumPad</h1><span class="connection" data-connection role="status">连接中…</span></div>
      <button type="button" class="soft-button chrome-button" data-theme-toggle aria-label="切换到黑色主题" title="切换到黑色主题"><svg aria-hidden="true"><use href="#icon-moon"/></svg></button>
      <button type="button" class="soft-button chrome-button" data-settings-open aria-label="连接设置" title="连接设置"><svg aria-hidden="true"><use href="#icon-settings"/></svg></button>
    </header>
    <div class="workspace">
      <aside class="controls">
        <div class="page-tabs" role="tablist" aria-label="页面切换">
          <button type="button" class="soft-button" id="tab-input" role="tab" data-page-tab="input" aria-controls="page-input" aria-selected="true">数字 · 导航</button>
          <button type="button" class="soft-button" id="tab-tools" role="tab" data-page-tab="tools" aria-controls="page-tools" aria-selected="false" tabindex="-1">公式 · 编辑</button>
        </div>
        <div class="utility-panel">
          <div class="file-grid" aria-label="文件与剪贴板">
            <button type="button" class="soft-button key action-key" data-command="COPY" aria-label="复制" title="复制"><svg aria-hidden="true"><use href="#icon-copy"/></svg><small>复制</small></button>
            <button type="button" class="soft-button key action-key" data-command="PASTE" aria-label="粘贴" title="粘贴"><svg aria-hidden="true"><use href="#icon-paste"/></svg><small>粘贴</small></button>
            <button type="button" class="soft-button key action-key" data-command="SAVE" aria-label="保存" title="保存"><svg aria-hidden="true"><use href="#icon-save"/></svg><small>保存</small></button>
            <button type="button" class="soft-button key action-key" data-command="SAVE_AS" aria-label="另存" title="另存"><svg aria-hidden="true"><use href="#icon-save-as"/></svg><small>另存</small></button>
          </div>
          <nav class="direction-grid" aria-label="单元格方向导航">
          <button type="button" class="soft-button key" data-command="LEFT" aria-label="向左移动一格" title="向左"><svg class="dpad-face" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="dpad-outline" d="M10 100 Q0 100 0 90 L0 10 Q0 0 10 0 L45 0 Q55 0 61.69 7.433 L93.31 42.567 Q100 50 93.31 57.433 L61.69 92.567 Q55 100 45 100 L10 100 Z"/></svg><svg class="dpad-arrow" aria-hidden="true"><use href="#icon-left"/></svg></button>
          <button type="button" class="soft-button key" data-command="UP" aria-label="向上移动一格" title="向上"><svg class="dpad-face" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="dpad-outline" d="M0 10 Q0 0 10 0 L90 0 Q100 0 100 10 L100 45 Q100 55 92.567 61.69 L57.433 93.31 Q50 100 42.567 93.31 L7.433 61.69 Q0 55 0 45 L0 10 Z"/></svg><svg class="dpad-arrow" aria-hidden="true"><use href="#icon-up"/></svg></button>
          <button type="button" class="soft-button key" data-command="DOWN" aria-label="向下移动一格" title="向下"><svg class="dpad-face" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="dpad-outline" d="M100 90 Q100 100 90 100 L10 100 Q0 100 0 90 L0 55 Q0 45 7.433 38.31 L42.567 6.69 Q50 0 57.433 6.69 L92.567 38.31 Q100 45 100 55 L100 90 Z"/></svg><svg class="dpad-arrow" aria-hidden="true"><use href="#icon-down"/></svg></button>
          <button type="button" class="soft-button key" data-command="RIGHT" aria-label="向右移动一格" title="向右"><svg class="dpad-face" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="dpad-outline" d="M90 0 Q100 0 100 10 L100 90 Q100 100 90 100 L55 100 Q45 100 38.31 92.567 L6.69 57.433 Q0 50 6.69 42.567 L38.31 7.433 Q45 0 55 0 L90 0 Z"/></svg><svg class="dpad-arrow" aria-hidden="true"><use href="#icon-right"/></svg></button>
        </nav>
        </div>
      </aside>
      <section id="page-input" class="number-section" role="tabpanel" aria-labelledby="tab-input" data-page="input">
        <div class="number-grid">
          <button type="button" class="soft-button key action-key" data-command="UNDO" aria-label="撤销" title="撤销"><svg aria-hidden="true"><use href="#icon-undo"/></svg></button>
          <button type="button" class="soft-button key action-key" data-command="PREV_CELL" aria-label="上一格" title="上一格"><svg aria-hidden="true"><use href="#icon-prev"/></svg></button>
          <button type="button" class="soft-button key action-key" data-command="EDIT" aria-label="编辑" title="编辑"><svg aria-hidden="true"><use href="#icon-edit"/></svg></button>
          <button type="button" class="soft-button key action-key" data-command="DELETE" aria-label="Del 删除" title="Del 删除"><svg aria-hidden="true"><use href="#icon-delete"/></svg></button>
          <button type="button" class="soft-button key number-key" data-command="7">7</button>
          <button type="button" class="soft-button key number-key" data-command="8">8</button>
          <button type="button" class="soft-button key number-key" data-command="9">9</button>
          <button type="button" class="soft-button key action-key" data-command="BACKSPACE" aria-label="退格" title="Backspace 退格"><svg aria-hidden="true"><use href="#icon-backspace"/></svg></button>
          <button type="button" class="soft-button key number-key" data-command="4">4</button>
          <button type="button" class="soft-button key number-key" data-command="5">5</button>
          <button type="button" class="soft-button key number-key" data-command="6">6</button>
          <button type="button" class="soft-button key action-key" data-command="-" aria-label="负号" title="负号"><svg aria-hidden="true"><use href="#icon-minus"/></svg></button>
          <button type="button" class="soft-button key number-key" data-command="1">1</button>
          <button type="button" class="soft-button key number-key" data-command="2">2</button>
          <button type="button" class="soft-button key number-key" data-command="3">3</button>
          <button type="button" class="soft-button key action-key" data-command="NEXT_CELL" aria-label="下一格" title="下一格"><svg aria-hidden="true"><use href="#icon-next"/></svg></button>
          <button type="button" class="soft-button key number-key zero-key" data-command="0">0</button>
          <button type="button" class="soft-button key number-key" data-command="." aria-label="小数点">.</button>
          <button type="button" class="soft-button key action-key" data-command="ENTER" aria-label="Enter" title="Enter"><svg aria-hidden="true"><use href="#icon-enter"/></svg></button>
        </div>
      </section>
      <section id="page-tools" class="tools-page" role="tabpanel" aria-labelledby="tab-tools" data-page="tools" hidden>
        <h2>编辑</h2>
        <div class="editing-grid">
          <button type="button" class="soft-button key action-key" data-command="EDIT" aria-label="编辑" title="编辑"><svg aria-hidden="true"><use href="#icon-edit"/></svg></button>
          <button type="button" class="soft-button key action-key" data-command="UNDO" aria-label="撤销" title="撤销"><svg aria-hidden="true"><use href="#icon-undo"/></svg></button>
        </div>
        <h2>公式</h2>
        <div class="formula-grid">
          <button type="button" class="soft-button key formula-key" data-command="AUTO_SUM"><span aria-hidden="true">Σ</span><small>自动求和</small></button>
          <button type="button" class="soft-button key formula-key" data-command="FORMULA_AVERAGE"><span aria-hidden="true">AVG</span><small>平均值</small></button>
          <button type="button" class="soft-button key formula-key" data-command="FORMULA_MAX"><span aria-hidden="true">MAX</span><small>最大值</small></button>
          <button type="button" class="soft-button key formula-key" data-command="FORMULA_MIN"><span aria-hidden="true">MIN</span><small>最小值</small></button>
          <button type="button" class="soft-button key formula-key" data-command="FORMULA_ROUND"><span aria-hidden="true">ROUND</span><small>四舍五入</small></button>
          <button type="button" class="soft-button key formula-key" data-command="FORMULA_IF"><span aria-hidden="true">IF</span><small>条件判断</small></button>
        </div>
      </section>
    </div>
  </main>
  <dialog class="settings-dialog" data-settings-dialog aria-labelledby="settings-title">
    <div class="dialog-heading"><h2 id="settings-title">连接设置</h2><button type="button" class="soft-button chrome-button" data-settings-close aria-label="关闭设置"><svg aria-hidden="true"><use href="#icon-close"/></svg></button></div>
    <p>电脑接收端地址</p><output data-server-address></output>
    <p class="settings-note">手机与电脑连接同一局域网，保持电脑接收端开启。请先选中 Excel / WPS 的目标单元格。</p>
    <button type="button" class="soft-button dialog-action" data-reconnect>重新连接</button>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
